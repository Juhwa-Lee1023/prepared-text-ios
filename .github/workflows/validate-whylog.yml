name: validate-whylog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate-whylog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Validate PR commit range
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/validate-whylog
        with:
          target: --range ${{ github.event.pull_request.base.sha }}..${{ github.sha }} --strict --skip-unstructured
      - name: Validate pushed head
        if: github.event_name == 'push'
        uses: ./.github/actions/validate-whylog
        with:
          target: --rev HEAD --strict --skip-unstructured
